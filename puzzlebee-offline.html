/* Articoli e plurali: due giochi che usano la stessa lista di nomi. */
(function () {
  'use strict';
  const { h } = PB;

  // [singolare, plurale, emoji, genere m/f]
  const NOUNS = [
    ['gatto', 'gatti', '🐱', 'm'], ['cane', 'cani', '🐶', 'm'], ['libro', 'libri', '📚', 'm'], ['treno', 'treni', '🚂', 'm'],
    ['pesce', 'pesci', '🐟', 'm'], ['fiore', 'fiori', '🌸', 'm'], ['fungo', 'funghi', '🍄', 'm'], ['topo', 'topi', '🐭', 'm'],
    ['zaino', 'zaini', '🎒', 'm'], ['scoiattolo', 'scoiattoli', '🐿️', 'm'], ['squalo', 'squali', '🦈', 'm'],
    ['scorpione', 'scorpioni', '🦂', 'm'], ['sciatore', 'sciatori', '⛷️', 'm'],
    ['orso', 'orsi', '🐻', 'm'], ['albero', 'alberi', '🌳', 'm'], ['elefante', 'elefanti', '🐘', 'm'],
    ['aereo', 'aerei', '✈️', 'm'], ['uovo', 'uova', '🥚', 'm'], ['ombrello', 'ombrelli', '☂️', 'm'],
    ['zebra', 'zebre', '🦓', 'f'], ['scarpa', 'scarpe', '👟', 'f'], ['stella', 'stelle', '⭐', 'f'],
    ['zucca', 'zucche', '🎃', 'f'], ['mela', 'mele', '🍎', 'f'], ['casa', 'case', '🏠', 'f'], ['luna', 'lune', '🌙', 'f'],
    ['palla', 'palle', '⚽', 'f'], ['nave', 'navi', '🚢', 'f'], ['chiave', 'chiavi', '🔑', 'f'],
    ['ape', 'api', '🐝', 'f'], ['arancia', 'arance', '🍊', 'f'], ['anatra', 'anatre', '🦆', 'f'],
  ];

  const vowelStart = (w) => /^[aeiou]/.test(w);
  const special = (w) => /^(z|s[^aeiou]|gn|ps|x|y)/.test(w); // lo / uno / gli

  function articles(noun) {
    const [sing, , , g] = noun;
    if (g === 'm') {
      const det = vowelStart(sing) ? "l'" : special(sing) ? 'lo' : 'il';
      const ind = special(sing) ? 'uno' : 'un';
      const pl = vowelStart(sing) || special(sing) ? 'gli' : 'i';
      return { det, ind, pl: sing === 'uovo' ? 'le' : pl };
    }
    return { det: vowelStart(sing) ? "l'" : 'la', ind: vowelStart(sing) ? "un'" : 'una', pl: 'le' };
  }

  function ruleText(kind, art, noun) {
    const [sing, , , g] = noun;
    if (noun[0] === 'uovo' && kind === 'pl') return 'Attenzione: un uovo, ma LE uova!';
    if (art === "l'" || art === "un'") return `${sing.toUpperCase()} comincia con una vocale.`;
    if (art === 'lo' || art === 'uno' || (art === 'gli' && special(sing))) return `Davanti a ${sing.startsWith('z') ? 'Z' : 'S + consonante'} si usa ${art.toUpperCase()}.`;
    if (art === 'gli') return `${sing.toUpperCase()} è maschile e comincia con una vocale: GLI.`;
    return `${sing.toUpperCase()} è ${g === 'm' ? 'maschile' : 'femminile'}.`;
  }

  const join = (art, w) => (art.endsWith("'") ? art + w : art + ' ' + w);

  function makeArticle(level, r) {
    const noun = r.pick(NOUNS);
    const a = articles(noun);
    const kind = level <= 7 ? 'det' : level <= 14 ? r.pick(['det', 'pl']) : r.pick(['det', 'pl', 'ind']);
    const set = { det: ['il', 'lo', 'la', "l'"], pl: ['i', 'gli', 'le'], ind: ['un', 'uno', 'una', "un'"] }[kind];
    const right = a[kind];
    const word = kind === 'pl' ? noun[1] : noun[0];
    const emoji = kind === 'pl' ? noun[2] + noun[2] + noun[2] : noun[2];
    return {
      key: kind + noun[0],
      prompt: 'Quale articolo ci va?',
      visual: h('div', { class: 'quiz-col' }, h('div', { class: 'word-pic small' }, emoji), h('div', { class: 'expr word' }, h('span', { class: 'hole' }, '?'), ' ' + word.toUpperCase())),
      why: `${join(right, word).toUpperCase()}. ${ruleText(kind, right, noun)}`,
      say: join(right, word),
      optClass: 'words',
      options: set.map((s) => ({ label: s.toUpperCase(), correct: s === right, cls: 'word' })),
    };
  }

  function wrongPlurals(sing, right) {
    const stem = sing.slice(0, -1);
    const out = new Set([stem + 'i', stem + 'e', stem + 'a', sing + 's', sing]);
    if (/c[ao]$|g[ao]$/.test(sing)) { out.add(stem + 'i'); out.add(stem + 'he'); out.add(stem + 'hi'); }
    out.delete(right);
    return [...out];
  }

  function makePlural(level, r) {
    const noun = r.pick(NOUNS);
    const toSing = level >= 12 && r.chance(0.4);
    const a = articles(noun);
    if (toSing) {
      const right = noun[0];
      const wrongs = r.shuffle([noun[1].slice(0, -1) + 'a', noun[1].slice(0, -1) + 'e', noun[1].slice(0, -1) + 'o']
        .filter((w, i, arr) => w !== right && w !== noun[1] && arr.indexOf(w) === i)).slice(0, 2);
      return {
        key: 's' + noun[0],
        prompt: 'Uno solo: come si dice?',
        visual: h('div', { class: 'quiz-col' }, h('div', { class: 'word-pic small' }, noun[2] + noun[2] + noun[2]),
          h('div', { class: 'expr word' }, `${a.pl.toUpperCase()} ${noun[1].toUpperCase()} → ${a.ind.toUpperCase()}${a.ind.endsWith("'") ? '' : ' '}`, h('span', { class: 'hole' }, '?'))),
        why: `${join(a.ind, noun[0]).toUpperCase()}, ${join(a.pl, noun[1]).toUpperCase()}.`,
        optClass: 'words',
        options: [{ label: right.toUpperCase(), correct: true, cls: 'word' }].concat(wrongs.map((w) => ({ label: w.toUpperCase(), cls: 'word' }))),
      };
    }
    const right = noun[1];
    const wrongs = r.shuffle(wrongPlurals(noun[0], right)).slice(0, level <= 6 ? 1 : 2);
    return {
      key: 'p' + noun[0],
      prompt: 'Tanti: come si dice?',
      visual: h('div', { class: 'quiz-col' }, h('div', { class: 'word-pic small' }, noun[2]),
        h('div', { class: 'expr word' }, `${join(a.ind, noun[0]).toUpperCase()} → ${a.pl.toUpperCase()} `, h('span', { class: 'hole' }, '?'))),
      why: noun[0] === 'uovo' ? 'Un uovo, tante UOVA: è una parola speciale!' : `${join(a.ind, noun[0]).toUpperCase()}, tanti: ${join(a.pl, noun[1]).toUpperCase()}.`,
      optClass: 'words',
      options: [{ label: right.toUpperCase(), correct: true, cls: 'word' }].concat(wrongs.map((w) => ({ label: w.toUpperCase(), cls: 'word' }))),
    };
  }

  PB.register({
    id: 'articoli',
    subject: 'italiano',
    title: 'Gli articoli',
    icon: '📝',
    color: '#26a69a',
    desc: 'IL, LO, LA, GLI, UN, UNA…',
    ages: [7],
    create(root, ctx) {
      PB.quiz(root, ctx, { total: 6, make: makeArticle });
    },
  });

  PB.register({
    id: 'plurale',
    subject: 'italiano',
    title: 'Uno e tanti',
    icon: '👯',
    color: '#ab47bc',
    desc: 'Singolare e plurale',
    ages: [7],
    create(root, ctx) {
      PB.quiz(root, ctx, { total: 6, make: makePlural });
    },
  });
})();

(function () {

      case 'ovale': mk('ellipse', { cx: 50, cy: 50, rx: 40, ry: 22 + r() * 6 }); break;
      case 'triangolo': {
        const t = r.int(0, 2);
        if (t === 0) mk('polygon', { points: regular(3, 40, free) });
        else if (t === 1) mk('polygon', { points: '15,85 85,85 15,20' }); // rettangolo
        else mk('polygon', { points: `10,80 90,80 ${r.int(25, 75)},15` });
        break;
      }
      case 'quadrato': { const k = 28 + r() * 10; mk('rect', { x: 50 - k, y: 50 - k, width: 2 * k, height: 2 * k }); break; }
      case 'rettangolo': mk('rect', { x: 8, y: 28, width: 84, height: 44 }); break;
      case 'rombo': mk('polygon', { points: '50,6 76,50 50,94 24,50' }); break;
      case 'trapezio': mk('polygon', { points: `${r.int(22, 34)},25 ${r.int(66, 78)},25 92,78 8,78` }); break;
      case 'pentagono': mk('polygon', { points: regular(5, 42, r.chance(0.5) ? 0 : free) }); break;
      case 'esagono': mk('polygon', { points: regular(6, 42, r.chance(0.5) ? 0 : free) }); break;
      default: break;
    }
    el.setAttribute('fill', color);
    el.setAttribute('stroke', 'rgba(0,0,0,.35)');
    el.setAttribute('stroke-width', '3');
    el.setAttribute('stroke-linejoin', 'round');
    // Quadrati e rettangoli ruotano poco, così non sembrano rombi.
    const rot = kind === 'quadrato' || kind === 'rettangolo' ? r.int(-12, 12) : kind === 'rombo' ? r.int(-15, 15) : kind === 'trapezio' ? r.pick([0, 0, 180]) : 0;
    if (rot) el.setAttribute('transform', `rotate(${rot} 50 50)`);
    s.append(el);
    return s;
  }

  function pool(level) {
    if (level <= 5) return ['cerchio', 'quadrato', 'triangolo', 'rettangolo'];
    if (level <= 12) return ['cerchio', 'quadrato', 'triangolo', 'rettangolo', 'rombo', 'ovale'];
    return Object.keys(SHAPES);
  }

  PB.register({
    id: 'forme',
    subject: 'geometria',
    title: 'Caccia alle forme',
    icon: '🔺',
    color: '#ef5350',
    desc: 'Riconosci triangoli, quadrati, rombi…',
    ages: [7],
    create(root, ctx) {
      const r = ctx.rng;
      const L = ctx.level;
      const total = 5;
      let done = 0;
      const prompt = h('div', { class: 'prompt small' });
      const field = h('div', { class: 'shape-field' });
      root.append(h('div', { class: 'game' }, prompt, field));

      function next() {
        ctx.progress(done, total);
        if (done >= total) return ctx.win();
        const kinds = pool(L);
        const bySides = L >= 9 && r.chance(0.4);
        const count = L <= 5 ? 8 : L <= 12 ? 10 : 12;
        let isTarget, label;
        if (bySides) {
          const n = r.pick([3, 4, 5, 6].filter((x) => kinds.some((k) => SHAPES[k].sides === x)));
          isTarget = (k) => SHAPES[k].sides === n;
          label = `Tocca tutte le forme con ${n} lati`;
        } else {
          const t = r.pick(kinds);
          isTarget = (k) => k === t;
          label = `Tocca tutti i ${SHAPES[t].plural}`;
        }
        const targets = kinds.filter(isTarget);
        const others = kinds.filter((k) => !isTarget(k));
        const nT = r.int(2, Math.min(4, count - 3));
        const list = r.shuffle(PB.range(count).map((i) => (i < nT ? r.pick(targets) : r.pick(others))));
        let left = nT;
        prompt.textContent = label;
        field.replaceChildren(...list.map((k) => {
          const b = h('button', {
            class: 'shape',
            'aria-label': k,
            onclick() {
              if (b.classList.contains('found')) return;
              if (isTarget(k)) {
                b.classList.add('found');
                PB.sound.pop();
                left--;
                if (left === 0) {
                  ctx.good();
                  done++;
                  setTimeout(next, 900);
                }
              } else {
                PB.shake(b);
                ctx.mistake();
              }
            },
          }, shapeSvg(k, r, r.pick(COLORS)));
          return b;
        }));
      }
      next();
    },
  });
})();

/* Specchio: completa il disegno simmetrico colorando le caselle dall'altra parte. */
(function () {
  'use strict';
  const { h } = PB;
  const PALETTE = ['#ef5350', '#42a5f5', '#ffca28'];

  PB.register({
    id: 'simmetria',
    subject: 'geometria',
    title: 'Specchio',
    icon: '🦋',
    color: '#ec407a',
    desc: 'Completa il disegno simmetrico',
    ages: [7],
    create(root, ctx) {
      const r = ctx.rng;
      const L = ctx.level;
      const half = L <= 5 ? 3 : L <= 12 ? 4 : 5; // colonne (o righe) di ogni metà
      const other = L <= 5 ? 4 : L <= 12 ? 5 : 6;
      const vertical = L < 8 || r.chance(0.6); // asse verticale (sinistra → destra)
      const rows = vertical ? other : half * 2;
      const cols = vertical ? half * 2 : other;
      const nColors = L <= 10 ? 1 : L <= 15 ? 2 : 3;
      const grid = new Array(rows * cols).fill(-1);
      const idx = (y, x) => y * cols + x;
      const mirror = (y, x) => (vertical ? [y, cols - 1 - x] : [rows - 1 - y, x]);
      const isModel = (y, x) => (vertical ? x < half : y < half);

      // Disegno casuale nella metà modello, almeno qualche casella.
      let filled = 0;
      while (filled < 3) {
        filled = 0;
        grid.fill(-1);
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          if (isModel(y, x) && r.chance(0.4)) { grid[idx(y, x)] = r.int(0, nColors - 1); filled++; }
        }
      }
      const target = grid.slice();
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        if (isModel(y, x) && grid[idx(y, x)] >= 0) {
          const [my, mx] = mirror(y, x);
          target[idx(my, mx)] = grid[idx(y, x)];
        }
      }
      let need = filled;
      let color = 0;

      const board = h('div', { class: 'sym-grid' + (vertical ? ' v' : ' h'), style: `grid-template-columns: repeat(${cols}, var(--s))` });
      const cells = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const model = isModel(y, x);
        const v = grid[idx(y, x)];
        let cls = 'sym-cell' + (model ? ' model' : '');
        if (vertical && x === half - 1) cls += ' axis-r';
        if (!vertical && y === half - 1) cls += ' axis-b';
        const c = h('button', { class: cls, style: v >= 0 ? `background:${PALETTE[v]}` : '', onclick: () => tap(y, x) });
        cells.push(c);
        board.append(c);
      }
      const wrap = h('div', { class: 'board-wrap' }, board);
      const swatches = nColors > 1 ? h('div', { class: 'palette' }, PB.range(nColors).map((i) =>
        h('button', { class: 'swatch' + (i === 0 ? ' on' : ''), style: `background:${PALETTE[i]}`, onclick(e) {
          color = i;
          [...e.currentTarget.parentNode.children].forEach((b, k) => b.classList.toggle('on', k === i));
        } }))) : null;
      root.append(h('div', { class: 'game' }, h('div', { class: 'prompt small' }, vertical ? 'Colora a destra come nello specchio' : 'Colora sotto come nello specchio'), wrap, swatches));

      function tap(y, x) {
        if (isModel(y, x)) return;
        const i = idx(y, x);
        if (grid[i] >= 0) return;
        if (target[i] === color) {
          grid[i] = color;
          cells[i].style.background = PALETTE[color];
          cells[i].classList.add('ok');
          PB.sound.tap();
          need--;
          ctx.progress(filled - need, filled);
          if (need === 0) ctx.win();
        } else {
          PB.shake(cells[i]);
          cells[i].classList.add('wrong');
          setTimeout(() => cells[i].classList.remove('wrong'), 450);
          ctx.mistake();
        }
      }

      function layout() {
        board.style.setProperty('--s', PB.fitCell(wrap, cols, rows, 3, 80) + 'px');
      }
      layout();
      ctx.onResize(layout);
      ctx.progress(0, filled);
    },
  });
})();

/* Caccia al tesoro: caselle con lettere e numeri (es. B3), come sul quaderno a quadretti. */
(function () {
  'use strict';
  const { h } = PB;
  const LETTERS = 'ABCDEF';
  const THINGS = ['🍎', '⭐', '🐞', '🌸', '🍄', '🐟', '🎈', '🍪', '🐸', '🦋'];

  PB.register({
    id: 'coordinate',
    subject: 'geometria',
    title: 'Caccia al tesoro',
    icon: '🗺️',
    color: '#8d6e63',
    desc: 'Trova le caselle con lettere e numeri',
    ages: [7],
    create(root, ctx) {
      const r = ctx.rng;
      const L = ctx.level;
      const n = L <= 6 ? 4 : L <= 12 ? 5 : 6;
      const total = 6;
      let done = 0;
      const prompt = h('div', { class: 'prompt small' });
      const board = h('div', { class: 'coord-grid', style: `grid-template-columns: repeat(${n + 1}, var(--s))` });
      const wrap = h('div', { class: 'board-wrap' }, board);
      const answers = h('div', { class: 'options' });
      root.append(h('div', { class: 'game' }, prompt, wrap, answers));
      const name = (x, y) => LETTERS[x] + (y + 1);

      function next() {
        ctx.progress(done, total);
        if (done >= total) return ctx.win();
        // Tipo: 'tocca' (tocca la casella B3) oppure 'dove' (dov'è la mela?).
        const type = L <= 4 ? 'tocca' : r.pick(['tocca', 'dove']);
        const items = new Map();
        const nItems = type === 'dove' ? r.int(3, Math.min(5, n)) : r.int(0, 3);
        const things = r.shuffle(THINGS);
        while (items.size < nItems) items.set(r.int(0, n * n - 1), things[items.size]);
        const goal = type === 'dove' ? [...items.keys()][0] : r.int(0, n * n - 1);
        const gx = goal % n;
        const gy = Math.floor(goal / n);
        let locked = false;

        // Righe dal numero più alto in alto (come un grafico) fino a 1 in basso.
        board.replaceChildren();
        for (let row = n - 1; row >= 0; row--) {
          board.append(h('div', { class: 'coord-label' }, String(row + 1)));
          for (let x = 0; x < n; x++) {
            const i = row * n + x;
            const c = h('button', {
              class: 'coord-cell',
              onclick() {
                if (type !== 'tocca' || locked) return;
                if (i === goal) {
                  locked = true;
                  c.classList.add('right');
                  c.textContent = '💎';
                  ctx.good();
                  done++;
                  setTimeout(next, 900);
                } else {
                  PB.shake(c);
                  ctx.mistake();
                }
              },
            }, items.get(i) || '');
            board.append(c);
          }
        }
        board.append(h('div', { class: 'coord-label' }));
        for (let x = 0; x < n; x++) board.append(h('div', { class: 'coord-label' }, LETTERS[x]));

        if (type === 'tocca') {
          prompt.textContent = `Il tesoro è nella casella ${name(gx, gy)}: toccala!`;
          answers.replaceChildren();
        } else {
          prompt.textContent = `In quale casella c'è ${items.get(goal)}?`;
          const wrong = new Set();
          [[gy, gx], [gx + 1, gy], [gx - 1, gy], [gx, gy + 1], [gx, gy - 1], [r.int(0, n - 1), r.int(0, n - 1)]]
            .forEach(([x, y]) => { if (x >= 0 && y >= 0 && x < n && y < n && !(x === gx && y === gy)) wrong.add(name(x, y)); });
          const opts = r.shuffle([name(gx, gy)].concat(r.shuffle([...wrong]).slice(0, 3)));
          answers.replaceChildren(...opts.map((o) => {
            const b = h('button', {
              class: 'opt num',
              onclick() {
                if (locked || b.disabled) return;
                if (o === name(gx, gy)) {
                  locked = true;
                  b.classList.add('right');
                  ctx.good();
                  done++;
                  setTimeout(next, 900);
                } else {
                  b.disabled = true;
                  PB.shake(b);
                  ctx.mistake();
                }
              },
            }, o);
            return b;
          }));
        }
        layout();
      }

      function layout() {
        board.style.setProperty('--s', PB.fitCell(wrap, n + 1, n + 1, 4, 84) + 'px');
      }
      ctx.onResize(layout);
      next();
    },
  });
})();

/* Programma l'ape: prepara la lista di frecce e poi premi Via. Primo approccio al coding. */
(function () {
  'use strict';
  const { h } = PB;
  const DIRS = { U: [0, -1, '⬆️'], D: [0, 1, '⬇️'], L: [-1, 0, '⬅️'], R: [1, 0, '➡️'] };
  const OBST = ['🌵', '🪨', '🌳'];

  function bfs(n, blocked, start, goal) {
    const dist = new Array(n * n).fill(-1);
    dist[start] = 0;
    const q = [start];
    while (q.length) {
      const c = q.shift();
      for (const k in DIRS) {
        const x = (c % n) + DIRS[k][0];
        const y = Math.floor(c / n) + DIRS[k][1];
        if (x < 0 || y < 0 || x >= n || y >= n) continue;
        const nc = y * n + x;
        if (blocked.has(nc) || dist[nc] >= 0) continue;
        dist[nc] = dist[c] + 1;
        q.push(nc);
      }
    }
    return dist[goal];
  }

  PB.register({
    id: 'programma',
    subject: 'logica',
    title: "Programma l'ape",
    icon: '🤖',
    color: '#78909c',
    desc: "Scegli le frecce e guida l'ape al fiore",
    ages: [7],
    create(root, ctx) {
      const r = ctx.rng;
      const L = ctx.level;
      const n = L <= 6 ? 4 : L <= 13 ? 5 : 6;
      const [minLen, maxLen] = L <= 3 ? [2, 3] : L <= 6 ? [3, 5] : L <= 10 ? [4, 6] : L <= 15 ? [5, 8] : [7, 10];
      const nObst = L <= 3 ? 1 : L <= 8 ? 3 : L <= 14 ? 5 : 7;
      const obstEmoji = OBST[0];

      let start, goal, blocked, best;
      for (let tries = 0; tries < 500; tries++) {
        start = r.int(0, n * n - 1);
        goal = r.int(0, n * n - 1);
        if (goal === start) continue;
        blocked = new Set();
        while (blocked.size < nObst) {
          const c = r.int(0, n * n - 1);
          if (c !== start && c !== goal) blocked.add(c);
        }
        best = bfs(n, blocked, start, goal);
        if (best >= minLen && best <= maxLen) break;
      }
      if (!(best >= 1)) { // caso rarissimo: niente ostacoli
        blocked = new Set();
        best = bfs(n, blocked, start, goal);
      }
      const maxProg = best + 4;

      let program = [];
      let running = false;
      let bee = start;
      const board = h('div', { class: 'code-grid', style: `grid-template-columns: repeat(${n}, var(--s))` });
      const cells = PB.range(n * n).map(() => h('div', { class: 'code-cell' }));
      board.append(...cells);
      const wrap = h('div', { class: 'board-wrap' }, board);
      const progEl = h('div', { class: 'program' });
      const msg = h('div', { class: 'why' }, ' ');
      const btn = (k) => h('button', { class: 'pbtn', onclick: () => add(k) }, DIRS[k][2]);
      const controls = h('div', { class: 'code-controls' },
        btn('U'), btn('D'), btn('L'), btn('R'),
        h('button', { class: 'pbtn', 'aria-label': 'Cancella', onclick: undo }, '⌫'),
        h('button', { class: 'pbtn go', onclick: run }, '▶️'));
      root.append(h('div', { class: 'game' },
        h('div', { class: 'prompt small' }, `Porta l'ape al fiore 🌻 in ${best} mosse o poco più`), wrap, progEl, controls, msg));

      function draw(trail) {
        cells.forEach((c, i) => {
          c.textContent = i === bee ? '🐝' : i === goal ? '🌻' : blocked.has(i) ? obstEmoji : '';
          c.classList.toggle('trail', !!(trail && trail.has(i)));
          c.classList.toggle('block', blocked.has(i));
        });
      }
      function drawProg(active) {
        progEl.replaceChildren(...(program.length
          ? program.map((k, i) => h('span', { class: 'pstep' + (i === active ? ' on' : '') }, DIRS[k][2]))
          : [h('span', { class: 'tray-empty' }, 'Tocca le frecce qui sotto')]));
      }
      function add(k) {
        if (running || program.length >= maxProg) return;
        program.push(k);
        PB.sound.tap();
        drawProg();
      }
      function undo() {
        if (running) return;
        program.pop();
        drawProg();
      }
      function run() {
        if (running || !program.length) return;
        running = true;
        msg.textContent = ' ';
        bee = start;
        const trail = new Set([start]);
        let i = 0;
        const stepFn = () => {
          if (i >= program.length) {
            running = false;
            if (bee === goal) {
              const stars = program.length <= best ? 3 : 2;
              msg.textContent = 'Evviva, il fiore! 🌻';
              ctx.win(ctx.mistakesCount() === 0 ? stars : ctx.mistakesCount() <= 2 ? Math.min(stars, 2) : 1);
            } else {
              fail('L’ape non è arrivata al fiore. Riprova!');
            }
            return;
          }
          const [dx, dy] = DIRS[program[i]];
          const x = (bee % n) + dx;
          const y = Math.floor(bee / n) + dy;
          drawProg(i);
          if (x < 0 || y < 0 || x >= n || y >= n || blocked.has(y * n + x)) {
            running = false;
            fail(x < 0 || y < 0 || x >= n || y >= n ? 'Ops! L’ape è uscita dal prato.' : 'Ops! C’è un ostacolo.');
            return;
          }
          bee = y * n + x;
          trail.add(bee);
          PB.sound.tap();
          draw(trail);
          i++;
          setTimeout(stepFn, 380);
        };
        stepFn();
      }
      function fail(text) {
        ctx.mistake();
        msg.textContent = text;
        PB.shake(board);
        setTimeout(() => {
          bee = start;
          draw();
          drawProg();
        }, 900);
      }

      function layout() {
        board.style.setProperty('--s', PB.fitCell(wrap, n, n, 4, 90) + 'px');
      }
      draw();
      drawProg();
      layout();
      ctx.onResize(layout);
    },
  });
})();

/* Frutti misteriosi: ogni frutto vale un numero. Scoprilo dalle somme. */
(function () {
  'use strict';
  const { h } = PB;
  const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍐', '🍒', '🍉'];

  function line(terms, result) {
    const parts = [];
    terms.forEach((t, i) => {
      if (i) parts.push(h('span', { class: 'op' }, '+'));
      parts.push(h('span', { class: 'fruit' }, t));
    });
    parts.push(h('span', { class: 'op' }, '='));
    parts.push(h('span', { class: result === '?' ? 'hole' : 'res' }, String(result)));
    return h('div', { class: 'eq' }, parts);
  }

  function make(level, r) {
    const nUnknown = level <= 6 ? 1 : level <= 13 ? 2 : 3;
    const maxV = level <= 6 ? 5 : level <= 13 ? 8 : 10;
    const f = r.shuffle(FRUITS).slice(0, nUnknown);
    const val = f.map(() => r.int(1, maxV));
    const lines = [];
    // Prima riga: il primo frutto ripetuto (2 o 3 volte) così si può scoprire.
    const rep = level <= 3 ? 2 : r.int(2, 3);
    lines.push(line(PB.range(rep).map(() => f[0]), rep * val[0]));
    for (let k = 1; k < nUnknown; k++) {
      // Ogni riga aggiunge un frutto nuovo insieme a uno già noto.
      const known = r.int(0, k - 1);
      lines.push(line(r.shuffle([f[known], f[k]]), val[known] + val[k]));
    }
    let answer;
    let ask;
    const askSum = level >= 10 && r.chance(0.4);
    if (askSum) {
      const a = r.int(0, nUnknown - 1);
      const b = r.int(0, nUnknown - 1);
      ask = line([f[a], f[b], f[0]].slice(0, nUnknown >= 2 ? 3 : 2), '?');
      answer = val[a] + val[b] + (nUnknown >= 2 ? val[0] : 0);
    } else {
      const k = nUnknown - 1;
      ask = h('div', { class: 'eq ask' }, h('span', { class: 'fruit' }, f[k]), h('span', { class: 'op' }, '='), h('span', { class: 'hole' }, '?'));
      answer = val[k];
    }
    const wrong = PB.nearNumbers(r, answer, 3, 0, 40);
    const exp = f.map((x, i) => `${x} = ${val[i]}`).join(', ');
    return {
      key: f.join('') + val.join(','),
      prompt: 'Quanto vale?',
      visual: h('div', { class: 'quiz-col eqs' }, lines, ask),
      why: `Giusto! ${exp}`,
      say: 'Giusto!',
      options: [{ label: String(answer), correct: true, cls: 'num' }].concat(wrong.map((w) => ({ label: String(w), cls: 'num' }))),
    };
  }

  PB.register({
    id: 'frutti',
    subject: 'logica',
    title: 'Frutti misteriosi',
    icon: '🍌',
    color: '#ffca28',
    desc: 'Ogni frutto vale un numero: scoprilo!',
    ages: [7],
    create(root, ctx) {
      PB.quiz(root, ctx, { total: 5, make });
    },
  });
})();

/* La torre: sposta tutti i dischi sul palo di destra. Mai un disco grande sopra uno piccolo. */
(function () {
  'use strict';
  const { h } = PB;
  const COLORS = ['#ef5350', '#ffa726', '#ffca28', '#66bb6a', '#42a5f5', '#7e57c2'];

  PB.register({
    id: 'torre',
    subject: 'logica',
    title: 'La torre',
    icon: '🗼',
    color: '#5c6bc0',
    desc: 'Sposta la torre sul palo di destra',
    ages: [7],
    create(root, ctx) {
      const L = ctx.level;
      const n = L <= 3 ? 2 : L <= 9 ? 3 : L <= 16 ? 4 : 5;
      const best = Math.pow(2, n) - 1;
      const pegs = [PB.range(n).map((i) => n - i), [], []]; // dal basso: n..1
      let held = -1;
      let moves = 0;
      let done = false;

      const counter = h('span', { class: 'counter' }, `Mosse: 0 (le migliori: ${best})`);
      const area = h('div', { class: 'hanoi' });
      const pegEls = PB.range(3).map((p) => {
        const el = h('button', { class: 'peg' + (p === 2 ? ' goal' : ''), onclick: () => tap(p) });
        area.append(el);
        return el;
      });
      root.append(h('div', { class: 'game' },
        h('div', { class: 'prompt small' }, 'Sposta tutta la torre sul palo con la bandierina 🚩'), counter, area,
        h('div', { class: 'why' }, 'Un disco alla volta. Mai un disco grande sopra uno piccolo!')));

      function render() {
        pegEls.forEach((el, p) => {
          el.replaceChildren(h('div', { class: 'pole' }), ...(p === 2 ? [h('div', { class: 'flag' }, '🚩')] : []),
            ...pegs[p].map((d, i) => h('div', {
              class: 'disk' + (held === p && i === pegs[p].length - 1 ? ' lifted' : ''),
              style: `width:${30 + (d / n) * 65}%;background:${COLORS[(d - 1) % COLORS.length]}`,
            })));
          el.classList.toggle('sel', held === p);
        });
      }

      function tap(p) {
        if (done) return;
        if (held < 0) {
          if (!pegs[p].length) return;
          held = p;
          PB.sound.tap();
        } else if (held === p) {
          held = -1;
        } else {
          const d = pegs[held][pegs[held].length - 1];
          const top = pegs[p][pegs[p].length - 1];
          if (top && top < d) {
            PB.shake(pegEls[p]);
            ctx.mistake();
            return;
          }
          pegs[p].push(pegs[held].pop());
          held = -1;
          moves++;
          PB.sound.tap();
          counter.textContent = `Mosse: ${moves} (le migliori: ${best})`;
          if (pegs[2].length === n) {
            done = true;
            render();
            const stars = moves <= best ? 3 : moves <= best * 1.6 ? 2 : 1;
            return ctx.win(ctx.mistakesCount() > 2 ? Math.min(stars, 2) : stars);
          }
        }
        render();
      }
      render();
    },
  });
})();

/* Le ombre: quale ombra appartiene alla figura? */
(function () {
  'use strict';
  const { h } = PB;

  // Gruppi di figure con sagome diverse ma "parenti" (più difficili da distinguere).
  const GROUPS = [
    ['🐶', '🐱', '🐰', '🐭', '🐻', '🐷'],
    ['🦁', '🐘', '🦒', '🦓', '🦏', '🐊'],
    ['🐄', '🐖', '🐑', '🐓', '🐐', '🐴'],
    ['🐟', '🐙', '🦀', '🐬', '🐳', '🦈'],
    ['🍎', '🍌', '🍇', '🍓', '🍐', '🍒', '🍍'],
    ['🚗', '🚲', '🚂', '✈️', '🚁', '⛵', '🚀'],
    ['🎸', '🎺', '🥁', '🎻', '🎹'],
    ['🐝', '🦋', '🐞', '🐌', '🕷️', '🐜'],
    ['🌵', '🌳', '🌴', '🍄', '🌻', '🌷'],
  ];

  function make(level, r) {
    const nOpts = level <= 6 ? 3 : 4;
    let pool;
    if (level <= 6) pool = r.shuffle(GROUPS.flat());
    else pool = r.shuffle(r.pick(GROUPS)); // stessa famiglia: più difficile
    const items = pool.slice(0, nOpts);
    const answer = items[0];
    const reverse = level >= 12 && r.chance(0.5); // mostra l'ombra e chiedi la figura
    const flip = level >= 16 ? ' flip' : '';
    return {
      key: answer,
      prompt: reverse ? 'Di chi è questa ombra?' : 'Qual è la sua ombra?',
      visual: h('div', { class: 'word-pic' + (reverse ? ' shadow' + flip : '') }, answer),
      optClass: 'shadows',
      options: items.map((it) => ({ label: h('span', { class: reverse ? '' : 'shadow' + flip }, it), correct: it === answer, cls: 'pic' })),
    };
  }

  PB.register({
    id: 'ombre',
    subject: 'logica',
    title: 'Le ombre',
    icon: '👤',
    color: '#607d8b',
    desc: 'Trova l’ombra giusta',
    ages: [7],
    create(root, ctx) {
      PB.quiz(root, ctx, { total: 6, make });
    },
  });
})();

/* PuzzleBee — schermate, navigazione, livelli e stelle. */
(function () {
  'use strict';
  const { h, store } = PB;

  const AGES = [5, 6, 7, 8, 9, 10];
  const READY_AGES = new Set([7]);
  const LEVELS = 20;
  const app = document.getElementById('app');

  let cleanup = [];
  let resizeFns = [];
  let screenToken = 0;

  const gamesFor = (age) => PB.puzzles.filter((p) => p.ages.includes(age));
  const unlocked = (age, game, lvl) => lvl === 1 || store.stars(age, game.id, lvl - 1) > 0;
  const go = (hash) => {
    if (location.hash === hash) route();
    else location.hash = hash;
  };

  /* ---------- Componenti ---------- */
  function soundButton() {
    const b = h('button', {
      class: 'iconbtn',
      'aria-label': 'Suono',
      onclick() {
        PB.sound.muted = !PB.sound.muted;
        b.textContent = PB.sound.muted ? '🔇' : '🔊';
      },
    }, PB.sound.muted ? '🔇' : '🔊');
    return b;
  }

  function topbar(title, backHash, extra) {
    return h('header', { class: 'topbar' },
      backHash ? h('button', { class: 'iconbtn', 'aria-label': 'Indietro', onclick: () => go(backHash) }, '⬅️') : null,
      h('div', { class: 'title' }, title),
      extra || null,
      soundButton());
  }

  function starsRow(n, max) {
    return h('span', { class: 'stars' }, PB.range(max || 3).map((i) => h('span', { class: i < n ? 'on' : 'off' }, '★')));
  }

  function show(...children) {
    app.replaceChildren(h('div', { class: 'screen' }, ...children));
  }

  /* ---------- Schermate ---------- */
  function renderHome() {
    show(
      topbar('', null),
      h('div', { class: 'scroll center' },
        h('div', { class: 'logo' }, h('div', { class: 'logo-bee' }, '🐝'), h('h1', null, 'PuzzleBee')),
        h('p', { class: 'subtitle' }, 'Quanti anni hai?'),
        h('div', { class: 'ages' },
          AGES.map((a) => {
            const ready = READY_AGES.has(a);
            return h('button', {
              class: 'age' + (ready ? '' : ' soon'),
              disabled: !ready,
              onclick: () => go('#/eta/' + a),
            }, h('b', null, String(a)), h('small', null, ready ? 'anni' : 'presto!'));
          })),
        h('div', { class: 'home-offline' }, PB.offlineBadge ? PB.offlineBadge() : null)));
  }

  const SUBJECTS = [
    { id: 'matematica', label: 'Matematica', icon: '➕' },
    { id: 'italiano', label: 'Italiano', icon: '📖' },
    { id: 'geometria', label: 'Geometria', icon: '📐' },
    { id: 'logica', label: 'Logica', icon: '🧠' },
  ];

  function gameCard(age, g) {
    const got = store.gameTotal(age, g.id);
    return h('button', { class: 'gcard', style: `--c:${g.color}`, onclick: () => go(`#/eta/${age}/gioco/${g.id}`) },
      h('div', { class: 'gicon' }, g.icon),
      h('div', { class: 'gtext' },
        h('b', null, g.title),
        h('small', null, g.desc),
        h('div', { class: 'bar' }, h('i', { style: `width:${(got / (LEVELS * 3)) * 100}%` })),
        h('small', { class: 'gstars' }, `★ ${got} / ${LEVELS * 3}`)));
  }

  function renderGames(age) {
    const games = gamesFor(age);
    show(
      topbar(`${age} anni`, '#/'),
      h('div', { class: 'scroll' },
        SUBJECTS.map((sub) => {
          const list = games.filter((g) => (g.subject || 'logica') === sub.id);
          if (!list.length) return null;
          return h('section', { class: 'subject' },
            h('h2', { class: 'subject-title' }, h('span', null, sub.icon), sub.label),
            h('div', { class: 'games' }, list.map((g) => gameCard(age, g))));
        })));
  }

  function renderLevels(age, game) {
    show(
      topbar(`${game.icon} ${game.title}`, `#/eta/${age}`),
      h('div', { class: 'scroll' },
        h('p', { class: 'subtitle' }, game.desc),
        h('div', { class: 'levels', style: `--c:${game.color}` },
          PB.range(LEVELS).map((i) => {
            const lvl = i + 1;
            const open = unlocked(age, game, lvl);
            const st = store.stars(age, game.id, lvl);
            return h('button', {
              class: 'lvl' + (open ? '' : ' locked') + (st ? ' done' : ''),
              disabled: !open,
              onclick: () => go(`#/eta/${age}/gioco/${game.id}/${lvl}`),
            }, h('b', null, open ? String(lvl) : '🔒'), open ? starsRow(st) : null);
          }))));
  }

  function renderPlay(age, game, lvl) {
    const token = ++screenToken;
    const dots = h('div', { class: 'dots' });
    const stage = h('main', { class: 'stage' });
    show(topbar(`${game.icon} Livello ${lvl}`, `#/eta/${age}/gioco/${game.id}`, dots), stage);

    let mistakes = 0;
    let won = false;
    const ctx = {
      age,
      level: lvl,
      levels: LEVELS,
      rng: PB.makeRng((Math.random() * 4294967296) >>> 0),
      mistakesCount: () => mistakes,
      mistake() {
        mistakes++;
        PB.sound.bad();
      },
      good() {
        PB.sound.good();
      },
      progress(done, total) {
        if (total > 8) {
          dots.replaceChildren(h('span', { class: 'count' }, `${done}/${total}`));
        } else {
          dots.replaceChildren(...PB.range(total).map((i) => h('span', { class: 'dot' + (i < done ? ' on' : '') })));
        }
      },
      onResize(fn) {
        resizeFns.push(fn);
      },
      win(stars) {
        if (won) return;
        won = true;
        if (stars == null) stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
        store.setStars(age, game.id, lvl, stars);
        setTimeout(() => {
          if (token === screenToken) showWin(age, game, lvl, stars);
        }, 550);
      },
    };
    const c = game.create(stage, ctx);
    if (typeof c === 'function') cleanup.push(c);
  }

  /* ---------- Vittoria ---------- */
  const PRAISE = ['Bravissimo!', 'Fantastico!', 'Super!', 'Che campione!', 'Grande!', 'Evviva!'];

  function confetti() {
    const layer = h('div', { class: 'confetti' });
    const bits = ['🐝', '⭐', '🌸', '🍯', '✨', '🎉'];
    for (let i = 0; i < 28; i++) {
      layer.append(h('span', {
        style: `left:${Math.random() * 100}%;animation-delay:${Math.random() * 0.6}s;animation-duration:${1.8 + Math.random() * 1.4}s;font-size:${22 + Math.random() * 22}px`,
      }, bits[i % bits.length]));
    }
    document.body.append(layer);
    setTimeout(() => layer.remove(), 3600);
  }

  function showWin(age, game, lvl, stars) {
    PB.sound.win();
    const praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    PB.say(praise);
    confetti();
    const base = `#/eta/${age}/gioco/${game.id}`;
    const overlay = h('div', { class: 'overlay' },
      h('div', { class: 'win' },
        h('div', { class: 'win-stars' }, PB.range(3).map((i) =>
          h('span', { class: i < stars ? 'on' : 'off', style: `animation-delay:${0.15 + i * 0.25}s` }, '★'))),
        h('h2', null, praise),
        h('div', { class: 'win-actions' },
          lvl < LEVELS ? h('button', { class: 'btn primary', onclick: () => go(`${base}/${lvl + 1}`) }, 'Avanti ➡️') : null,
          h('button', { class: 'btn', onclick: () => go(`${base}/${lvl}`) }, '🔁 Rigioca'),
          h('button', { class: 'btn', onclick: () => go(base) }, '🗂️ Livelli'))));
    document.body.append(overlay);
  }

  /* ---------- Navigazione (hash, così funziona il tasto Indietro di Android) ---------- */
  function route() {
    cleanup.forEach((fn) => { try { fn(); } catch (e) { /* ignorato */ } });
    cleanup = [];
    resizeFns = [];
    screenToken++;
    document.querySelectorAll('.overlay').forEach((o) => o.remove());

    const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (p[0] === 'eta' && READY_AGES.has(+p[1])) {
      const age = +p[1];
      if (p[2] === 'gioco') {
        const game = gamesFor(age).find((g) => g.id === p[3]);
        if (game) {
          const lvl = +p[4];
          if (lvl >= 1 && lvl <= LEVELS && unlocked(age, game, lvl)) return renderPlay(age, game, lvl);
          return renderLevels(age, game);
        }
      }
      return renderGames(age);
    }
    renderHome();
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => resizeFns.forEach((fn) => fn()), 120);
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('pointerdown', () => PB.sound.unlock(), { passive: true });
  // Evita lo zoom con il doppio tocco su iOS.
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

  route();

  /* ---------- Offline ---------- */
  let offlineReady = false;
  function offlineBadge() {
    return offlineReady ? h('div', { class: 'offline-ok' }, '✈️ Pronto anche senza internet') : null;
  }
  PB.offlineBadge = offlineBadge;

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => caches.keys())
      .then((keys) => (keys.some((k) => k.startsWith('puzzlebee-')) ? caches.open(keys.find((k) => k.startsWith('puzzlebee-'))) : null))
      .then((c) => (c ? c.match('js/app.js', { ignoreSearch: true }) : null))
      .then((hit) => {
        if (!hit) return;
        offlineReady = true;
        const home = document.querySelector('.home-offline');
        if (home) home.replaceChildren(offlineBadge());
      })
      .catch(() => { /* offline non disponibile */ });
  }
})();

  </script>
