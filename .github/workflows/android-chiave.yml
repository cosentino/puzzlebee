# Da avviare UNA SOLA VOLTA, a mano (Actions → "Crea chiave Android" → Run workflow).
# Crea la chiave di caricamento per Google Play e la salva nel repository CIFRATA
# con la password del secret ANDROID_KEYSTORE_PASSWORD. Senza quella password il file è inutilizzabile.
name: Crea chiave Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlli
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f android/upload-key.jks.enc ]; then echo "La chiave esiste già: non la sovrascrivo." && exit 1; fi
          if [ ${#PASS} -lt 20 ]; then echo "Imposta il secret ANDROID_KEYSTORE_PASSWORD con almeno 20 caratteri." && exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crea e cifra la chiave
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload-key.jks" -storetype PKCS12 \
            -alias puzzlebee -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=PuzzleBee, O=PuzzleBee, C=IT"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:PASS \
            -in "$RUNNER_TEMP/upload-key.jks" -out android/upload-key.jks.enc
          keytool -list -v -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$PASS" | grep -E "SHA256:" || true
          rm "$RUNNER_TEMP/upload-key.jks"
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/upload-key.jks.enc
          git commit -m "Chiave di caricamento Android (cifrata)"
          git push
