# Costruisce l'app iOS/iPadOS su un Mac di GitHub e la carica su App Store Connect (TestFlight).
# Serve l'Apple Developer Program e questi secrets:
#   APPLE_TEAM_ID              es. ABCDE12345
#   ASC_KEY_ID                 ID della chiave API di App Store Connect
#   ASC_ISSUER_ID              Issuer ID della chiave API
#   ASC_KEY_P8                 contenuto del file .p8 (testo, compreso BEGIN/END)
name: App iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla i secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then echo "Mancano i secrets Apple: vedi STORE.md" && exit 1; fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios
      - name: Chiave API
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/asc.p8"
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Archivio firmato
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PuzzleBee.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - name: Carica su App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PuzzleBee.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
